# =============================================================================
# Nginx vhost per Odino — admin control center per Menia.io
# Path consigliato: /etc/nginx/sites-available/odino.menia.io
# Symlink: /etc/nginx/sites-enabled/odino.menia.io
#
# DEPLOY (sul server, dopo recovery SSH):
#   1. Copia il bundle in /var/www/odino.menia.io:
#        rsync -av dist-admin/ root@178.104.218.61:/var/www/odino.menia.io/
#   2. Copia questo file in /etc/nginx/sites-available/odino.menia.io
#   3. ln -s /etc/nginx/sites-available/odino.menia.io /etc/nginx/sites-enabled/
#   4. Cert TLS:
#        certbot --nginx -d odino.menia.io --redirect --hsts --staple-ocsp
#   5. nginx -t && systemctl reload nginx
#
# Sicurezza già attiva (eredita configurazione globale):
#   - HSTS preload (definito a livello server-block dopo certbot)
#   - server_tokens off
#   - TLS 1.2/1.3 only
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name odino.menia.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odino.menia.io;

    # Certbot popola questi due path
    ssl_certificate     /etc/letsencrypt/live/odino.menia.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odino.menia.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ----- Headers di sicurezza specifici Odino ------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # noindex anche a livello header (CSP del bundle ha già <meta robots>)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ----- Rate limiting (ammin = pochi utenti, traffic basso) ---------------
    # Definisci a livello http {} in nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=odino_zone:10m rate=60r/m;
    limit_req zone=odino_zone burst=20 nodelay;

    # ----- IP allowlist OPZIONALE -------------------------------------------
    # Decommenta + aggiungi IP per chiudere a casa/ufficio:
    #   allow 1.2.3.4;        # IP statico admin
    #   deny all;

    root /var/www/odino.menia.io;
    index index.admin.html;

    # SPA: tutte le rotte non-asset → index.admin.html
    location / {
        try_files $uri /index.admin.html;
    }

    # Asset con hash → cache lungo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* verso il backend (stesso processo che serve menia.io)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Blocca accesso a path non utili (eviti leak)
    location ~ /\.(?!well-known) { deny all; }
    location ~ ~$ { deny all; }

    access_log /var/log/nginx/odino.access.log;
    error_log  /var/log/nginx/odino.error.log warn;
}
