<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/menia-favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/menia-logo.png" />
    <link rel="apple-touch-icon" href="/menia-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Menia.io — Formazione online per creator e professionisti</title>
    <meta name="theme-color" content="#0A1428" />
    <!-- Anticipa TLS handshake verso Supabase: la prima query auth/profile
         parte ~1.5–2s prima del normale, accorciando il cold start. -->
    <link rel="preconnect" href="https://tqtqrzhmyaxsosgttzoa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://tqtqrzhmyaxsosgttzoa.supabase.co" />
    <!-- Content Security Policy.
         script-src 'self'  → kills inline / external script injection (XSS)
         connect-src        → frontend talks only to its own /api + Supabase + Sentry
         frame-src          → only payment-provider checkouts may iframe in
         object-src 'none'  → no Flash / legacy plugins
         base-uri  'self'   → prevents <base> tag hijacking
         upgrade-insecure-requests → auto-upgrades any leftover http:// link
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://live.menia.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.sentry.io https://live.menia.io wss://live.menia.io; worker-src 'self' blob:; frame-src 'self' https://*.stripe.com https://gumroad.com https://*.gumroad.com https://*.lemonsqueezy.com https://live.menia.io; form-action 'self' https://*.stripe.com https://gumroad.com https://*.gumroad.com https://*.lemonsqueezy.com; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
