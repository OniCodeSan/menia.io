<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/menia-favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/menia-logo-512.png" />
    <link rel="apple-touch-icon" href="/menia-logo-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Menia.io — Formazione online per creator e professionisti</title>
    <meta name="theme-color" content="#0A1428" />
    <!-- Anticipa TLS handshake verso Supabase: la prima query auth/profile
         parte ~1.5–2s prima del normale, accorciando il cold start. -->
    <link rel="preconnect" href="https://tqtqrzhmyaxsosgttzoa.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://tqtqrzhmyaxsosgttzoa.supabase.co" />
    <!-- Content Security Policy.
         script-src 'self'  → kills inline / external script injection (XSS)
         connect-src        → frontend talks only to its own /api + Supabase + Sentry
         frame-src          → only payment-provider checkouts may iframe in
         object-src 'none'  → no Flash / legacy plugins
         base-uri  'self'   → prevents <base> tag hijacking
         upgrade-insecure-requests → auto-upgrades any leftover http:// link
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://live.menia.io https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.sentry.io https://live.menia.io wss://live.menia.io https://www.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; frame-src 'self' https://*.stripe.com https://gumroad.com https://*.gumroad.com https://*.lemonsqueezy.com https://live.menia.io; form-action 'self' https://*.stripe.com https://gumroad.com https://*.gumroad.com https://*.lemonsqueezy.com; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />

    <!-- Google Analytics 4 (G-3289V4EBDR) — GDPR-compliant via Consent Mode v2.
         Default: tutti i consensi DENIED. Il CookieBanner chiama
         gtag('consent','update', ...) quando l'utente accetta gli analytics. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      // Se l'utente aveva già accettato in una visita precedente, aggiorna subito
      try {
        var c = JSON.parse(localStorage.getItem('menia:cookie_consent') || 'null');
        if (c && c.analytics === true) {
          gtag('consent', 'update', { analytics_storage: 'granted' });
        }
      } catch (e) {}
      gtag('js', new Date());
      gtag('config', 'G-3289V4EBDR', { anonymize_ip: true });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3289V4EBDR"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
